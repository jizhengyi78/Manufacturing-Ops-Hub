[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-agent"
version = "0.1.0"
description = "制造业多Agent生产运维数字助手"
requires-python = ">=3.10"
authors = [{ name = "dev" }]

dependencies = [
    # Web Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=1.8.0",
    "websockets>=12.0",
    # Data Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    # LangChain / LangGraph
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0",
    # LLM Clients
    "openai>=1.30.0",
    # Vector / Retrieval
    "pymilvus>=2.4.0",
    "elasticsearch>=8.12.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6.0",
    "FlagEmbedding>=1.2.0",
    # Database / Cache
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    # Async / Queue
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    # Document Parsing
    "python-multipart>=0.0.9",
    "unstructured>=0.12.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "prometheus-client>=0.19.0",
    # Utils
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "jinja2>=3.1.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.27.0",
    "locust>=2.24.0",
    "ragas>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
